model = "gpt-5.6-terra"
model_context_window = 1000000
suppress_unstable_features_warning = true
model_reasoning_summary = "detailed"
model_auto_compact_token_limit = 950000
model_verbosity = "high"
disable_response_storage = true
approval_policy = "never"
model_reasoning_effort = "high"
sandbox_mode = "danger-full-access"
web_search = "live"
service_tier = "default"

[model_providers.custom]
name = "OpenAI"
wire_api = "responses"
requires_openai_auth = true
supports_websockets = true
supports_standalone_web_search = true

[features.multi_agent_v2]
max_concurrent_threads_per_session = 64
enabled = true

[features]
goals = true
multi_agent = true
memories = true
hooks = true
chronicle = true

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = 'node "{{CODEX_HOME}}/hooks/session-zh-reminder.mjs"'
async = false
timeoutSec = 5
statusMessage = "注入中文 JSON 提醒"

[[hooks.UserPromptSubmit]]
matcher = ".*"
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = 'node "{{CODEX_HOME}}/hooks/superpowers-reminder.mjs"'
async = false
timeoutSec = 5
statusMessage = "检查 Superpowers 提醒"

[[hooks.UserPromptSubmit]]
matcher = ".*"
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = 'node "{{CODEX_HOME}}/hooks/creatorframework-agents-reminder.mjs"'
async = false
timeoutSec = 5
statusMessage = "提醒 CreatorFramework AGENTS.local 优先级"

[[hooks.PreToolUse]]
matcher = ".*"
[[hooks.PreToolUse.hooks]]
type = "command"
command = 'node "{{CODEX_HOME}}/hooks/prefer-node-script.mjs"'
async = false
timeoutSec = 5
statusMessage = "检查脚本语言偏好"

[[hooks.PreToolUse]]
matcher = "^(request_user_input|functions\\.request_user_input)$"
[[hooks.PreToolUse.hooks]]
type = "command"
command = 'node "{{CODEX_HOME}}/hooks/ask-user-question-validator.mjs"'
async = false
timeoutSec = 5
statusMessage = "检查结构化提问质量"

[[hooks.PreToolUse]]
matcher = "^(request_user_input|functions\\.request_user_input|update_plan|functions\\.update_plan)$"
[[hooks.PreToolUse.hooks]]
type = "command"
command = 'node "{{CODEX_HOME}}/hooks/zh-typo-guard.mjs"'
async = false
timeoutSec = 5
statusMessage = "检查中文错字"

[[hooks.PostToolUse]]
matcher = "^(apply_patch|create_file_code|replace_lines_code|copy_file_code|move_file_code|rename_file_code)$"
[[hooks.PostToolUse.hooks]]
type = "command"
command = 'node "{{CODEX_HOME}}/hooks/creatorframework-rule-sync-reminder.mjs"'
async = false
timeoutSec = 5
statusMessage = "提醒 CreatorFramework AI 规则同步"

[[hooks.PostToolUse]]
matcher = "^(apply_patch|create_file_code|replace_lines_code|copy_file_code|move_file_code|rename_file_code)$"
[[hooks.PostToolUse.hooks]]
type = "command"
command = 'node "{{CODEX_HOME}}/hooks/creatorframework-tscheck-reminder.mjs"'
async = false
timeoutSec = 5
statusMessage = "提醒 CreatorFramework TypeScript 类型检查"

[[hooks.PostToolUse]]
matcher = "^(exec|functions\\.exec|apply_patch|create_file_code|replace_lines_code|copy_file_code|move_file_code|rename_file_code)$"
[[hooks.PostToolUse.hooks]]
type = "command"
command = 'node "{{CODEX_HOME}}/hooks/superpowers-document-review-reminder.mjs"'
async = false
timeoutSec = 5
statusMessage = "提醒 Superpowers 文档审查"

[desktop]
sansFontSize = 13
usePointerCursors = true
followUpQueueMode = "steer"
conversationDetailMode = "STEPS_COMMANDS"
appearanceTheme = "system"
show-context-window-usage = true
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "max"]
localeOverride = "zh-CN"

[memories]
generate_memories = true
use_memories = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "context-remaining", "five-hour-limit", "context-window-size"]

[mcp_servers.chrome-devtools]
type = "stdio"
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest", "--autoConnect", "--no-usage-statistics"]

[mcp_servers.playwright]
type = "stdio"
command = "npx"
args = ["@playwright/mcp@latest"]
